[workspace]
members = [
    "crates/runtime-core",
    "crates/policy-engine",
    "crates/sandbox",
    "crates/process-supervisor",
    "crates/secret-broker",
    "crates/audit",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["VaultX Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/its-tanay003/VaultX-2.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = 1 }
suspicious = { level = "deny", priority = 1 }
complexity = { level = "warn", priority = 0 }
perf = { level = "warn", priority = 0 }
style = { level = "warn", priority = 0 }
