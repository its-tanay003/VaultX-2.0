  - id: "AST-CTX-MEM"
    name: "Context Memory & Vector Index"
    description: "RAG embeddings, repository AST index, and conversation state"
    confidentiality: "High"
    integrity: "High"
    availability: "High"
  - id: "AST-CYBER-TGT"
    name: "Authorized Cyber Lab Targets"
    description: "Isolated virtual machines, containers, and test ranges"
    confidentiality: "Low"
    integrity: "Medium"
    availability: "Medium"
  - id: "AST-ORG-DATA"
    name: "Cloud Organization & Multi-Tenant Data"
    description: "Enterprise policy templates, team audit sync payloads"
    confidentiality: "High"
    integrity: "High"
    availability: "High"

trust_boundaries:
  - id: "TB-01"
    name: "User / UI Webview Boundary"
    description: "Interface between operator and desktop frontend / CLI interface"
    untrusted_side: "Desktop Webview (Tauri frontend)"
    trusted_side: "Desktop Host Core"
    enforcement_mechanism: "Tauri 2 IPC isolation pattern, strict CSP, cryptographic message nonce"
  - id: "TB-02"
    name: "UI / Runtime Core IPC Boundary"
    description: "Typed message exchange between UI and the security supervisor"
    untrusted_side: "Client UI / CLI process"
    trusted_side: "Runtime Core Supervisor"
    enforcement_mechanism: "JSON Schema 2020-12 validation, protocol version negotiation, deny_unknown_fields"
  - id: "TB-03"
    name: "Runtime Supervisor / Sandbox Boundary"
    description: "Boundary separating host execution authority from untrusted workload processes"
    untrusted_side: "Guest agent process / build script / compiler"
    trusted_side: "Host process-supervisor crate"
    enforcement_mechanism: "Linux namespaces (bubblewrap/Landlock/seccomp), Windows Job Objects + restricted tokens, WSL2"
  - id: "TB-04"
    name: "Sandbox / Network Boundary"
    description: "Network egress from execution containers and sandboxed tools"
    untrusted_side: "Sandboxed tool or payload"
    trusted_side: "Host / external networks"
    enforcement_mechanism: "Agent Firewall, strict domain allowlist, SecurityScope CIDR and port filters"
  - id: "TB-05"
    name: "Model / Tool Execution Boundary"
    description: "Demarcation where probabilistic model output requests runtime operations"
    untrusted_side: "AI Model Output"
    trusted_side: "Policy Engine & Runtime Core"
    enforcement_mechanism: "Model is untrusted; ActionRequest policy evaluation before execution"
  - id: "TB-06"
    name: "Plugin / MCP Gateway Boundary"
    description: "Interface to external MCP servers and community plugins"
    untrusted_side: "MCP Server / Third-party plugin"
    trusted_side: "Tool Registry"
    enforcement_mechanism: "Tool Passport verification, SHA-256 fingerprinting, manifest review before connection"
  - id: "TB-07"
    name: "Local / Cloud Control Plane Boundary"
    description: "Boundary governing enterprise synchronization"
    untrusted_side: "Public Internet / Cloud API"
    trusted_side: "Local-First Workspace"
    enforcement_mechanism: "Local-only enforcement; no silent fallback; mTLS + tenant scoped auth"
  - id: "TB-08"
    name: "Project / Untrusted Repository Boundary"
    description: "Arbitrary repository files loaded from GitHub or local disk"
    untrusted_side: "Repository files, issues, PR comments, READMEs"
    trusted_side: "Context Engine / Agent Orchestrator"
    enforcement_mechanism: "Untrusted data demarcation; restricted trust mode; no automatic lifecycle script runs"
  - id: "TB-09"
    name: "Organization / User Multi-Tenant Boundary"
    description: "Separation of tenant data within shared cloud control plane"
    untrusted_side: "Tenant A users"
    trusted_side: "Tenant B resources"
    enforcement_mechanism: "Row-level security, tenant_id scoped tokens, Cedar RBAC policies"

actors:
  - id: "ACT-MAL-REPO"
    name: "Malicious Repository Author"
    description: "Attacker who creates or poisons a Git repository to compromise developers cloning it"
    motivation: "Credential theft, host compromise, supply-chain infiltration"
    access_level: "Repository file content"
  - id: "ACT-COMP-DEP"
    name: "Compromised Dependency Maintainer"
    description: "Upstream package maintainer whose account or crate/npm package is hijacked"
    motivation: "Widespread malware distribution, crypto-mining, backdoors"
    access_level: "Dependency source and install scripts"
  - id: "ACT-MAL-PLUGIN"
    name: "Malicious Plugin Publisher"
    description: "Adversary publishing deceptive extensions or MCP servers"
    motivation: "Secret exfiltration, lateral movement"
    access_level: "Plugin manifest and server responses"
  - id: "ACT-COMP-MCP"
    name: "Compromised MCP Server"
    description: "Legitimate external MCP service that is subverted or exhibits rug-pull behavior"
    motivation: "Context manipulation, unauthorized tool invocation"
    access_level: "MCP protocol responses"
  - id: "ACT-EXT-ATT"
    name: "External Attacker"
    description: "Hostile actor on local network or public internet"
    motivation: "Unauthorized access, service interruption"
    access_level: "Network packets"
  - id: "ACT-MAL-INS"
    name: "Malicious Insider"
    description: "Authorized project user attempting unauthorized actions or audit evasion"
    motivation: "Data exfiltration, policy circumvention"
    access_level: "Viewer/Developer project credentials"
  - id: "ACT-COMP-CRED"
    name: "Compromised Cloud Credential"
    description: "Stolen API token or deployment credential used out-of-band"
    motivation: "Cloud infrastructure takeover"
    access_level: "Cloud provider API"
  - id: "ACT-PROMPT-INJ"
    name: "Prompt Injection Author"
    description: "Attacker crafting indirect prompt injections in source code, commit messages, or web pages"
    motivation: "Hijack agent decision-making, bypass safety rules"
    access_level: "Data ingested into model context"
  - id: "ACT-ACC-USR"
    name: "Accidental / Unaware User"
    description: "Legitimate user approving dangerous actions due to fatigue, confusion, or deception"
    motivation: "Complete task quickly without realizing risks"
    access_level: "Local operator privileges"

threats:
  - id: "THREAT-INJ-001"
    name: "Indirect Prompt Injection via Repository Content"
    description: "Untrusted repository files or commit messages instruct the model to exfiltrate SSH keys or execute malicious payloads."
    stride_category: "Elevation of Privilege"
    standards_mapping:
      owasp_asi: "ASI05: Untrusted Data As Instructions"
      owasp_llm: "LLM01: Prompt Injection"
      mcp_risk: "N/A"
    likelihood: "High"
    impact: "Critical"
    initial_risk: "Critical"
    existing_controls:
      - "Repository files tagged as untrusted data in model context"
      - "Model cannot grant itself capabilities; runtime enforces policy"
      - "Secret Broker redacts and blocks raw secret access"
    control_status: "implemented"
    residual_risk: "Low"
    owner: "Tanay"
    tests:
      - id: "TEST-SPEC25-01"
        name: "Prompt injection asks for SSH key"
        expected: "Secret access blocked; policy denied; no secret read"
        status: "implemented"
      - id: "ABUSE-01"
        name: "Untrusted repository attempts to instruct agent to read SSH keys"
        expected: "Action blocked by Secret Broker and policy engine"
        status: "implemented"

  - id: "THREAT-DEP-002"
    name: "Malicious Dependency Package Lifecycle Execution"
    description: "A dependency installation runs a hidden postinstall/build script executing arbitrary code on the host."
    stride_category: "Elevation of Privilege"
    standards_mapping:
      owasp_asi: "ASI04: Supply Chain Vulnerabilities in Agent Artifacts"
      owasp_llm: "LLM03: Supply Chain Vulnerabilities"
      mcp_risk: "N/A"
    likelihood: "High"
    impact: "High"
    initial_risk: "High"
    existing_controls:
      - "Mandatory execution inside sandboxed process-supervisor container/Job Object"
      - "Restricted workspace trust mode prompts user review before install scripts run"
      - "Network egress blocked during build steps unless explicitly allowed"
    control_status: "implemented"
    residual_risk: "Low"
    owner: "Tanay"
    tests:
      - id: "TEST-SPEC25-02"
        name: "Repo runs hidden postinstall"
        expected: "Execution restricted and flagged; sandbox prevents host access"
        status: "implemented"
      - id: "ABUSE-04"
        name: "Package install executes a hidden lifecycle script"
        expected: "Process supervisor traps spawn; unapproved network egress blocked"
        status: "implemented"

  - id: "THREAT-NET-003"
    name: "Unauthorized Network Egress or Scope Abuse"
    description: "Agent attempts port scanning or active vulnerability exploitation against targets outside the authorized scope."
    stride_category: "Elevation of Privilege"
    standards_mapping:
      owasp_asi: "ASI01: Excessive Agency"
      owasp_llm: "LLM06: Excessive Agency"
      mcp_risk: "MCP04: Undeclared Capability Request"
    likelihood: "Medium"
    impact: "Critical"
    initial_risk: "Critical"
    existing_controls:
      - "SecurityScope cryptographically verified before any cyber tool execution"
      - "Agent Firewall kernel-level packet filter blocks non-allowlisted CIDRs/ports"
      - "Public-Internet active cyber operations denied by policy invariant"
    control_status: "implemented"
    residual_risk: "Low"
    owner: "Tanay"
    tests:
      - id: "TEST-SPEC25-03"
        name: "Agent targets out-of-scope CIDR"
        expected: "Network connection blocked; SCOPE_DENIED error emitted"
        status: "implemented"
      - id: "ABUSE-03"
        name: "Agent tries to scan an unauthorized network"
        expected: "Firewall rejects egress packets outside SecurityScope"
        status: "implemented"

  - id: "THREAT-SEC-004"
    name: "Plugin / MCP Tool Secret Harvesting"
    description: "An installed plugin or MCP server requests undeclared secrets or attempts to steal environment tokens."
    stride_category: "Information Disclosure"
    standards_mapping:
      owasp_asi: "ASI03: Insecure Tool Integration & Orchestration"
      owasp_llm: "LLM02: Sensitive Information Disclosure"
      mcp_risk: "MCP05: Secret Harvesting via Tool Arguments"
    likelihood: "High"
    impact: "Critical"
    initial_risk: "Critical"
    existing_controls:
      - "Secret Broker injects secrets by opaque reference at execution time only"
      - "Tools must declare secrets in signed Tool Passport"
      - "Undeclared secret access requests fail policy closed"
    control_status: "implemented"
    residual_risk: "Low"
    owner: "Tanay"
    tests:
      - id: "TEST-SPEC25-04"
        name: "Plugin requests undeclared secret"
        expected: "Policy denied; secret broker refuses injection"
        status: "implemented"
      - id: "ABUSE-02"
        name: "Malicious MCP tool requests secrets"
        expected: "Request rejected with POLICY_DENIED; audit event recorded"
        status: "implemented"

  - id: "THREAT-RES-005"
    name: "Resource Exhaustion / Runaway Process Spawning"
    description: "Malicious script or looping agent spawns excessive child processes or consumes all RAM/CPU causing host denial of service."
    stride_category: "Denial of Service"
    standards_mapping:
      owasp_asi: "ASI08: Cascading Failures & Non-Deterministic Amplification"
      owasp_llm: "LLM10: Unbounded Consumption"
      mcp_risk: "N/A"
    likelihood: "Medium"
    impact: "High"
    initial_risk: "High"
    existing_controls:
      - "process-supervisor enforces strict process tree quotas (max children, memory cap)"
      - "cgroups v2 / Windows Job Objects limit CPU quota and kill runaway trees"
      - "Strict timeout enforcement terminating unresponsive commands"
    control_status: "implemented"
    residual_risk: "Low"
    owner: "Tanay"
    tests:
      - id: "TEST-SPEC25-05"
        name: "Agent spawns excessive processes"
        expected: "Process supervisor terminates tree; RESOURCE_LIMIT error raised"
        status: "implemented"
      - id: "TEST-PROC-DENY-01"
        name: "Process supervisor zero timeout rejection"
        expected: "Command rejected before spawn"
        status: "implemented"
      - id: "TEST-PROC-FORKBOMB"
        name: "Contain fork bomb via max process tree quota and Job Object active process limit"
        expected: "Process tree contained; child processes killed; no host resource exhaustion"
        status: "implemented"
      - id: "TEST-PROC-RUNAWAY-CPU"
        name: "Terminate runaway 100% CPU process on timeout and CPU quota"
        expected: "Process killed promptly with KilledBySupervisor(Timeout)"
        status: "implemented"
      - id: "TEST-PROC-CANCEL-GRANDCHILD"
        name: "Cancel supervisor execution and terminate entire process tree including grandchildren"
        expected: "All descendant processes killed; zero orphaned background processes"
        status: "implemented"
      - id: "TEST-PROC-OUTPUT-TRUNCATE"
        name: "Truncate output flood at max_output_bytes and emit OutputTruncated event"
        expected: "Captured stdout/stderr bounded; OutputTruncated event recorded"
        status: "implemented"
      - id: "TEST-PROC-ARCH-CHOKEPOINT"
        name: "Enforce single process spawning choke point via workspace architecture scanner"
        expected: "Catches deliberate external process spawning and passes on clean tree"
        status: "implemented"

  - id: "THREAT-AUD-006"
    name: "Audit Trail Tampering or Log Deletion"
    description: "Compromised agent or local actor attempts to modify, rewrite, or truncate historical audit records."
    stride_category: "Tampering"
    standards_mapping:
      owasp_asi: "ASI10: Inadequate Telemetry, Auditability & Forensic Drift"
      owasp_llm: "LLM09: Misinformation"
      mcp_risk: "N/A"
    likelihood: "Medium"
    impact: "Critical"
    initial_risk: "High"
    existing_controls:
      - "Audit records generated server-side in Rust runtime; agent has no database write handle"
      - "Cryptographic SHA-256 hash chaining of every event"
      - "Events signed with runtime key inaccessible to guest processes"
    control_status: "implemented"
    residual_risk: "Minimal"
    owner: "Tanay"
    tests:
      - id: "TEST-SPEC25-06"
        name: "Agent tries to edit audit database"
        expected: "Permission denied; direct database file access blocked"
        status: "implemented"
      - id: "TEST-AUDIT-DENY-01"
        name: "Broken audit hash sequence verification"
        expected: "Audit verifier detects sequence tampering and flags anomaly"
        status: "implemented"
      - id: "TEST-AUDIT-TAMPER-MODIFIED"
        name: "Tamper detection: modified payload and metadata"
        expected: "Verification rejects modified entry hash with HashMismatch error"
        status: "implemented"
      - id: "TEST-AUDIT-TAMPER-DELETED"
        name: "Tamper detection: deleted intermediate rows"
        expected: "Verification rejects sequence gap with BrokenSequence error"
        status: "implemented"
      - id: "TEST-AUDIT-TAMPER-REORDERED"
        name: "Tamper detection: reordered and swapped records"
        expected: "Verification rejects out-of-order hash linkage with PrevHashMismatch error"
        status: "implemented"
      - id: "TEST-AUDIT-TAMPER-INSERTED"
        name: "Tamper detection: injected unauthorized records"
        expected: "Verification rejects forged record with SignatureInvalid or HashMismatch"
        status: "implemented"
      - id: "TEST-AUDIT-TAMPER-SIG"
        name: "Tamper detection: corrupted Ed25519 signature bytes"
        expected: "Verification fails with SignatureInvalid error"
        status: "implemented"
      - id: "TEST-AUDIT-SCALE-10K"
        name: "High-scale clean chain verification (10,000 events)"
        expected: "10,000 sequentially hashed and signed events verify with 100% validity"
        status: "implemented"
      - id: "TEST-AUDIT-KEY-NO-LEAK"
        name: "Signing key isolation and debug redaction"
        expected: "Key displays as [REDACTED] in debug logs and is never exposed over IPC"
        status: "implemented"

  - id: "THREAT-CLD-007"
    name: "Silent Cloud Fallback & Telemetry Leakage"
    description: "When operating in local-only mode, the system unexpectedly phones home or sends code/prompts to cloud APIs."
    stride_category: "Information Disclosure"
    standards_mapping:
      owasp_asi: "ASI01: Excessive Agency"
      owasp_llm: "LLM02: Sensitive Information Disclosure"
      mcp_risk: "N/A"
    likelihood: "Low"
    impact: "Critical"
    initial_risk: "High"
    existing_controls:
      - "ADR-008 & ADR-009: Telemetry disabled by default; local-only mode enforced"
      - "Network socket binding fails closed if local inference provider is unreachable"
      - "No hardcoded remote telemetry endpoints in core runtime"
    control_status: "implemented"
    residual_risk: "Minimal"
    owner: "Tanay"
    tests:
      - id: "TEST-SPEC25-07"
        name: "Cloud unavailable in local-only mode"
        expected: "No external HTTP requests attempted; error states local mode failure"
        status: "implemented"

  - id: "THREAT-VER-008"
    name: "False Security Finding Completion / Unverified Task Mutation"
    description: "Model claims a task or security remediation is completed without satisfying tests or compiler checks."
    stride_category: "Tampering"
    standards_mapping:
      owasp_asi: "ASI02: Autonomous Execution & Action Misdirection"
      owasp_llm: "LLM09: Misinformation"
      mcp_risk: "N/A"
    likelihood: "High"
    impact: "High"
    initial_risk: "High"
    existing_controls:
      - "Verification Engine independently executes build/test suites; model cannot self-certify"
      - "Automated Git checkpoint created prior to task; rollback triggered on verification failure"
      - "Evidence bundle requires cryptographic proof of tool outputs"
    control_status: "implemented"
    residual_risk: "Low"
    owner: "Tanay"
    tests:
      - id: "TEST-SPEC25-08"
        name: "Rollback after failed coding task"
        expected: "Repository worktree restored to pre-task Git checkpoint"
        status: "implemented"
      - id: "ABUSE-06"
        name: "Model falsely reports a security issue as fixed"
        expected: "Verification engine rejects completion due to failing test"
        status: "implemented"

  - id: "THREAT-CTX-009"
    name: "Context & Memory Poisoning"
    description: "Adversary inserts poisoned embeddings or crafted memories into vector store/RAG context to bias agent decisions across sessions."
    stride_category: "Tampering"
    standards_mapping:
      owasp_asi: "ASI06: Memory & Context Poisoning"
      owasp_llm: "LLM04: Data and Model Poisoning"
      mcp_risk: "N/A"
    likelihood: "Medium"
    impact: "High"
    initial_risk: "High"
    existing_controls:
      - "Context engine demarcates provenance: memories are untrusted data, not instructions"
      - "Session isolation: memory namespaces strictly scoped to project repository"
      - "Policy evaluation re-checks all actions independently of memory recommendations"
    control_status: "implemented"
    residual_risk: "Low"
    owner: "Tanay"
    tests:
      - id: "TEST-MEM-POISON-01"
        name: "Poisoned memory instructing capability escalation"
        expected: "Policy engine denies unauthorized action despite memory suggestion"
        status: "implemented"

  - id: "THREAT-FAT-010"
    name: "Human-Agent Trust Exploitation & Approval Fatigue"
    description: "Agent sends repetitive, rapid, or misleading approval dialogs to trick the user into rubber-stamping dangerous actions."
    stride_category: "Repudiation"
    standards_mapping:
      owasp_asi: "ASI09: Human-in-the-Loop Exploitation & Approval Fatigue"
      owasp_llm: "LLM06: Excessive Agency"
      mcp_risk: "N/A"
    likelihood: "High"
    impact: "Critical"
    initial_risk: "Critical"
    existing_controls:
      - "High-risk action approvals (L4/L5) show exact diffs, target paths, and action hashes"
      - "Rate limiting on approval prompts: multiple rapid requests pause the agent run"
      - "Approvals are cryptographically bound to action_hash; cannot be reused for altered actions"
    control_status: "implemented"
    residual_risk: "Medium"
    owner: "Tanay"
    tests:
      - id: "TEST-APPROVAL-BOUND-01"
        name: "Approval signature replayed against modified action hash"
        expected: "Runtime rejects approval; signature mismatch prevents execution"
        status: "implemented"
      - id: "TEST-POLICY-L4-APPROVAL"
        name: "L4 destructive command requires human approval"
        expected: "Action paused; APPROVAL_REQUIRED effect emitted"
        status: "implemented"

  - id: "THREAT-CAS-011"
    name: "Cascading Failures & Autonomous Amplification"
    description: "Subagent error or recursive replanning causes a spiral of broken actions, mutating files uncontrollably."
    stride_category: "Denial of Service"
    standards_mapping:
      owasp_asi: "ASI08: Cascading Failures & Non-Deterministic Amplification"
      owasp_llm: "LLM10: Unbounded Consumption"
      mcp_risk: "N/A"
    likelihood: "Medium"
    impact: "High"
    initial_risk: "High"
    existing_controls:
      - "Maximum replanning iteration limit per task (default 5)"
      - "Subagent execution depth bounded (max depth 3)"
      - "Checkpoint rollback on terminal failure restoring clean state"
    control_status: "planned"
    residual_risk: "Low"
    owner: "Tanay"
    tests:
      - id: "TEST-CASCADE-LIMIT-01"
        name: "Subagent loop exceeding maximum iteration depth"
        expected: "Orchestrator halts task; RESOURCE_LIMIT error emitted"
        status: "planned"

  - id: "THREAT-MCP-012"
    name: "Tool Output as an Injection Channel"
    description: "A tool executes safely, but its stdout/stderr contains crafted instructions designed to hijack the model in the next turn."
    stride_category: "Elevation of Privilege"
    standards_mapping:
      owasp_asi: "ASI05: Untrusted Data As Instructions"
      owasp_llm: "LLM01: Prompt Injection"
      mcp_risk: "MCP03: MCP Response / Tool Output Injection Channel"
    likelihood: "High"
    impact: "High"
    initial_risk: "High"
    existing_controls:
      - "All tool outputs wrapped in strict untrusted data delimiters in prompt context"
      - "Next-turn model output cannot bypass runtime capability policy"
      - "Tool output parsed with strict JSON/regex schemas before returning to context"
    control_status: "implemented"
    residual_risk: "Low"
    owner: "Tanay"
    tests:
      - id: "TEST-TOOL-OUTPUT-INJ-01"
        name: "Tool returns stdout containing system prompt override"
        expected: "Runtime treats response as untrusted data; policy evaluates next action strictly"
        status: "implemented"

  - id: "THREAT-RUG-013"
    name: "MCP Description Mutation After Approval (Rug Pull)"
    description: "An approved MCP server dynamically alters its tool description or parameters to perform malicious operations undetected."
    stride_category: "Tampering"
    standards_mapping:
      owasp_asi: "ASI03: Insecure Tool Integration & Orchestration"
      owasp_llm: "LLM03: Supply Chain Vulnerabilities"
      mcp_risk: "MCP01: Rug Pull / Post-Approval Tool Description Mutation"
    likelihood: "Medium"
    impact: "Critical"
    initial_risk: "Critical"
    existing_controls:
      - "Tool Passport binds SHA-256 fingerprint of the complete tool schema and manifest"
      - "Tool Registry re-verifies fingerprint at execution time"
      - "Any schema or description mutation invalidates approval and demands re-authorization"
    control_status: "planned"
    residual_risk: "Low"
    owner: "Tanay"
    tests:
      - id: "TEST-MCP-RUGPULL-01"
        name: "MCP tool modifies description after registration"
        expected: "Fingerprint mismatch detected; tool execution blocked until re-approved"
        status: "planned"

  - id: "THREAT-EXF-014"
