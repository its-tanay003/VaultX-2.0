  - id: "AST-USR-DATA"
    name: "User Profile & Environment Data"
    description: "Local user settings, IDE state, preferences"
    confidentiality: "Medium"
    integrity: "Medium"
    availability: "Medium"
  - id: "AST-SEC-FIND"
    name: "Security Findings & Vulnerability Reports"
    description: "Identified CWEs, remediation plans, and scan outputs"
    confidentiality: "High"
    integrity: "High"
    availability: "Medium"
  - id: "AST-POL-RULES"
    name: "Policy Rules & Capability Manifests"
    description: "Cedar/Rego authorization policies and Tool Passports"
    confidentiality: "Medium"
    integrity: "Critical"
    availability: "High"
  - id: "AST-AUDIT-LOG"
    name: "Tamper-Evident Audit Logs"
    description: "Hash-chained and signed event records of all actions"
    confidentiality: "Medium"
    integrity: "Critical"
    availability: "High"
  - id: "AST-TOOL-PKG"
    name: "Tool Packages & Sandbox Binaries"
    description: "Pre-validated tools (e.g., nmap, semgrep) and Kali container images"
    confidentiality: "Low"
    integrity: "High"
    availability: "High"
  - id: "AST-PLUGIN-CODE"
    name: "Plugin Code & MCP Manifests"
    description: "Third-party extension scripts and MCP server descriptors"
    confidentiality: "Medium"
    integrity: "High"
    availability: "High"
  - id: "AST-MDL-CONF"
    name: "Model Configurations & Offline Weights"
    description: "Local Ollama/llama.cpp model weights and system prompts"
