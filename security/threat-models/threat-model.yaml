    availability: "Medium"
  - id: "AST-CLOUD-CRED"
    name: "Cloud Credentials & IAM Tokens"
    description: "AWS/Azure/GCP credentials used for deployments"
    confidentiality: "Critical"
    integrity: "Critical"
    availability: "Medium"
  - id: "AST-SSH"
    name: "SSH Private Keys & Host Keys"
    description: "Host user private keys in ~/.ssh"
    confidentiality: "Critical"
    integrity: "High"
    availability: "Medium"
  - id: "AST-API-KEY"
