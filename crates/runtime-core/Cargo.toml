[package]
name = "valutx-runtime-core"
version = "0.1.0"
edition = "2021"
authors = ["VaultX Team"]
license = "MIT OR Apache-2.0"
description = "Central lifecycle state machine and execution coordinator for VaultX 2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["serde", "v4"] }
tokio = { version = "1", features = ["full"] }
rand = "0.8"
thiserror = "1"
sysinfo = "0.31"
valutx-process-supervisor = { path = "../process-supervisor" }

[[bin]]
name = "valutx"
path = "src/bin/valutx.rs"
