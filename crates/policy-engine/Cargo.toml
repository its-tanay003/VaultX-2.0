[package]
name = "valutx-policy-engine"
version = "0.1.0"
edition = "2021"
authors = ["VaultX Team"]
license = "MIT OR Apache-2.0"
description = "Continuous capability and attribute-based policy engine for VaultX 2.0"

[dependencies]
cedar-policy = { version = "4.13", features = ["datetime", "ipaddr"] }
valutx-audit = { path = "../audit" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "1"

[dev-dependencies]
tempfile = "3"

