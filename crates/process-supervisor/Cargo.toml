[package]
name = "valutx-process-supervisor"
version = "0.1.0"
edition = "2021"
authors = ["VaultX Team"]
license = "MIT OR Apache-2.0"
description = "Sole authorized process execution gateway for VaultX 2.0"

[dependencies]
valutx-policy-engine = { path = "../policy-engine" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
sysinfo = "0.31"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_Security",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
