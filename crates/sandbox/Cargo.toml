[package]
name = "valutx-sandbox"
version = "0.1.0"
edition = "2021"
authors = ["VaultX Team"]
license = "MIT OR Apache-2.0"
description = "OS-level isolation adapter: Landlock+seccomp (Linux/WSL2), Job Objects (Windows), bwrap fallback"

[dependencies]
thiserror = "1"
serde = { version = "1.0", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
serde_json = "1.0"
